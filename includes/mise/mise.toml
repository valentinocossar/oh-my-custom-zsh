[tools]
ansible-core = { version = "2.21", uvx = "true", uvx_args = "--with ansible,passlib,bcrypt,jmespath,netaddr,cryptography" }
bun = "1.4"
go = "1.27"
node = "26"
opentofu = "1.12"
php = "8.5"
pipx = "1.16"
"pipx:poetry" = "2.4"
python = "3.14"
uv = "latest"

[settings]
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "go"
]
trusted_config_paths = [
  "~/.oh-my-custom-zsh",
  "~/Workspace"
]

[env]
COMPOSER_HOME = "{{ env.HOME }}/.composer"

[tasks.bump]
description = "Bump every tool except php, which is a symlink to the Homebrew keg"
run = "mise upgrade --bump --exclude php"
