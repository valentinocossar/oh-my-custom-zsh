[tools]
ansible-core = { version = "2.21", uvx = "true", uvx_args = "--with ansible,passlib,bcrypt,jmespath,netaddr,cryptography" }
bun = "1.4"
go = "1.27"
node = "24"
opentofu = "1.12"
pipx = "1.16"
"pipx:poetry" = "2.4"
python = "3.14"
uv = "latest"

[settings]
disable_tools = ["php"] # Avoid missing PHP warnings because Lerd provides PHP per site
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "go"
]
trusted_config_paths = [
  "~/.oh-my-custom-zsh",
  "~/Workspace"
]

[env]
COMPOSER_HOME = "{{ env.HOME }}/.composer"

[tasks.bump]
description = "Bump every tool except node (pinned to a major, bumped by hand to the next LTS)"
run = "mise upgrade --bump --exclude node"
